# Pages CMS config — https://pagescms.org
# Install the Pages CMS GitHub App on this repo, then edit at app.pagescms.org.

# Each image folder the CMS should let you browse / upload to. `name` is how
# image fields below reference a folder (options.media).
media:
  - name: events
    label: Event posters
    input: src/assets/img/events
    output: /assets/img/events
    categories: [image]
  - name: gallery
    label: Gallery photos
    input: src/assets/img/gallery
    output: /assets/img/gallery
    categories: [image]
  - name: photos
    label: Site photos (hero, about)
    input: src/assets/img/photos
    output: /assets/img/photos
    categories: [image]

content:
  - name: events
    label: Events
    type: collection
    path: content/events
    filename: '{fields.title}.md'
    view:
      fields: [title, date, venue, city]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: time, label: Time, type: string, pattern: '^$|^\s*\d{1,2}[:.]\d{2}\s*[–-]\s*\d{1,2}[:.]\d{2}\s*$', description: "e.g. 15:00-21:00 (24h, start-end) — drives the schedule and the event end time" }
      - { name: venue, label: Venue, type: string }
      - { name: city, label: City, type: string, description: "Defaults to Stockholm if left blank" }
      - { name: price, label: Admission, type: string, description: "e.g. “350 SEK” or “Free”" }
      - { name: ticketUrl, label: Ticket URL, type: string, pattern: '^$|^https?://' }
      - { name: image, label: Poster / graphic, type: image, options: { media: events }, description: "Shown at the top of the event page and in link previews" }
      - { name: photo, label: Event photo, type: image, options: { media: photos }, description: "Optional. A past event with no poster leads with this photo instead" }
      - name: lineup
        label: Line-up
        type: object
        description: "Performers, in order. Use this instead of listing them in the description — it drives the sitewide Artists list reliably."
        list:
          sortable: true
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - { name: name, label: Artist / act, type: string, required: true }
          - { name: url, label: Link, type: string, pattern: '^$|^https?://' }
      - { name: description, label: Description, type: text, description: "Body text. Don't list performers here — use the Line-up field above. ALL-CAPS lines become headings; lines with web addresses are removed." }

  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    fields:
      - name: settings
        label: Text & links
        type: object
        fields:
          - { name: site_title, label: Site title, type: string }
          - { name: tagline, label: Tagline (hero + meta description), type: text }
          - { name: about, label: About text, type: text }
          - { name: experience, label: How to experience it, type: text }
          - { name: founders, label: Team / founders, type: text }
          - { name: gallery_intro, label: Gallery intro line, type: text }
          - { name: artists_intro, label: Artists line (after the number), type: text, description: "Shown on /events/ as “<count> <this text>”" }
          - { name: about_photo_credit, label: About photo credit, type: string }
          - { name: contact_email, label: Contact email, type: string, pattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$' }
          - { name: mailing_url, label: Mailing-list URL, type: string, pattern: '^$|^https?://' }
          - { name: instagram, label: Instagram URL, type: string, pattern: '^$|^https?://' }
          - { name: facebook, label: Facebook URL, type: string, pattern: '^$|^https?://' }
          - { name: youtube, label: YouTube URL, type: string, pattern: '^$|^https?://' }
      - name: photographers
        label: Photographers (gallery credit)
        type: object
        list:
          sortable: true
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - { name: name, label: Name, type: string }
          - { name: url, label: Instagram URL, type: string }
      - name: artists
        label: Artists (links & extras)
        type: object
        description: "Most artists are detected automatically from event line-ups. Add an entry here to attach a link, or to include someone who never appeared in a parsed line-up."
        list:
          sortable: true
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }
          - { name: edition, label: Edition, type: string }
          - { name: url, label: URL, type: string }
      - name: partners
        label: Partners
        type: object
        list:
          sortable: true
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - { name: name, label: Name, type: string }
          - { name: url, label: URL, type: string }
      - name: media
        label: Press
        type: object
        list:
          sortable: true
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - { name: title, label: Headline – Outlet, type: string }
          - { name: url, label: URL, type: string }
